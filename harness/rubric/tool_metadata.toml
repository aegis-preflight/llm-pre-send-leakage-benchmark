# LLM Pre-Send Leakage Benchmark — v1 rubric metadata for 20 tested tools.
#
# The scorer joins this file with the per-tool raw capture data to produce
# results/results_v1.csv. Four of the five rubric dimensions live here
# (D2 user notification, D3 transit encryption, D4 vendor retention TOS,
# D5 audit log accessibility). The fifth, D1 pre-send redaction, is
# computed from the capture data by harness/score.py.
#
# Scoring scale for every dimension: 0 (none / worst) / 1 (partial) /
# 2 (strong / best). Composite is the sum (0–10 max) mapped to bands:
#   0–2 No protection · 3–5 Minimal · 6–8 Moderate · 9–10 Strong.
#
# **The numeric values below are the v1 baseline** and will be finalized
# in paper/paper.md alongside their citation URLs before the v1.0.0 tag.
# The scorer treats them as canonical; disputes go through the paper's
# revision process, not through silent edits to this file.
#
# Fields per tool
# ---------------
#   tool                 Stable identifier. Matches the ``tool`` field on
#                        HarnessResult and the ``results/raw/<tool>.json``
#                        filename. Locked at v1.0.0 tag.
#   display_name         Human-readable name for the CSV / paper.
#   tier                 Which product tier was tested (free / plus / pro /
#                        api-direct / enterprise-default).
#   category             Chatbot / Productivity / Code AI / API direct / Agentic.
#   d2_notification, d3_encryption, d4_retention, d5_audit  Integer 0-2.
#   references           URL per dimension citing the public source of the
#                        score. Where possible, includes a quoted excerpt
#                        (in double quotes) from the source page.
#   verification         "verified" | "partial" | "unverified".
#                          verified   = every URL fetched and every claim
#                                       quoted from the source page
#                          partial    = at least one URL verified but not
#                                       all; typically D4 is the most
#                                       important to verify (retention +
#                                       training posture)
#                          unverified = URLs are plausible but none were
#                                       machine-fetched to confirm
#   last_verified        ISO date of the most recent WebFetch that
#                        confirmed the cited claims. Blank / "" for
#                        unverified rows.
#
# Notes on constant dimensions
# ----------------------------
# D2 (user notification) is 0 for every tool in v1 — no measured tool
# warns users about sensitive content before send. D3 (transit
# encryption) is 2 for every tool — HTTPS is universal. Both are
# non-discriminating in v1; the paper's discussion section addresses
# whether to redesign them for v2 (D3 → cert pinning strength;
# D2 → temporary-chat / ephemeral modes) or drop them.

schema_version = 1

